<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <meta name="description" content="Simple 5x5 barbell strength tracker that works offline.">
  <title>Starkheben 5×5</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header class="top">
    <h1>Starkheben <span>5×5</span></h1>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="timer" class="timer" hidden></div>
  <nav class="tabs" aria-label="Sections">
    <button data-view="today" aria-current="page">Today</button>
    <button data-view="calendar">Calendar</button>
    <button data-view="progress">Progress</button>
    <button data-view="program">Program</button>
    <button data-view="settings">Settings</button>
  </nav>
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="modal-text">
      <p id="modal-text"></p>
      <div class="row">
        <button class="btn" id="modal-cancel">Cancel</button>
        <button class="btn primary" id="modal-ok">OK</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
